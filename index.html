<!DOCTYPE html>
<!--
  Smoothie kiosk patch-notes page (GitHub Pages).
  Served from the smoothie-distribution repo root alongside changelog.json.
  This file is the source-of-truth template; release.yml copies it into the
  distribution repo on every release. Edit the design HERE, not in that repo.

  A product-style changelog app with i18n: language toggle, version sidebar
  with scroll-spy, sticky category filter tabs + live search, typed badges.

  Adding a language later: add it to LANGS + I18N below, and provide that key
  in changelog.json's summary/text objects (or fenced ---xx--- tag sections).
  Content fields may be a plain string (shown for every language) or an object
  like {"en": "...", "ko": "..."}; missing translations fall back gracefully.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>스무디 키오스크 · Changelog</title>
  <meta name="description" content="스무디 키오스크 앱의 새로운 기능과 개선 사항 안내" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #ffffff;
      --bg-soft: #f7f7f9;
      --panel:   #ffffff;
      --ink:     #0e1014;
      --ink-2:   #383d47;
      --muted:   #6a707c;
      --line:    #e9eaee;
      --line-2:  #dcdee4;
      --accent:  #d6336c;
      --accent-weak: color-mix(in srgb, var(--accent) 12%, transparent);
      --ring:    color-mix(in srgb, var(--accent) 35%, transparent);
      --shadow:  0 1px 2px rgba(14,16,20,0.04), 0 12px 32px -16px rgba(14,16,20,0.18);

      --c-feature-fg: #0c7a43; --c-feature-bg: #d9f3e4;
      --c-improvement-fg: #3340c0; --c-improvement-bg: #e2e6fb;
      --c-fix-fg: #a96400; --c-fix-bg: #fbeecb;
      --c-chore-fg: #57606f; --c-chore-bg: #eceef2;

      --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --kr: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      --header-h: 60px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #0b0c0f;
        --bg-soft: #111318;
        --panel:   #14161b;
        --ink:     #f2f3f5;
        --ink-2:   #c6cad2;
        --muted:   #888e9a;
        --line:    #21242b;
        --line-2:  #2c3038;
        --accent:  #f0568f;
        --shadow:  0 1px 2px rgba(0,0,0,0.4), 0 16px 40px -20px rgba(0,0,0,0.7);

        --c-feature-fg: #5fd693; --c-feature-bg: rgba(34,160,90,0.16);
        --c-improvement-fg: #9aa8ff; --c-improvement-bg: rgba(90,110,240,0.18);
        --c-fix-fg: #f0bd6a; --c-fix-bg: rgba(205,150,45,0.18);
        --c-chore-fg: #aab2c0; --c-chore-bg: rgba(150,160,180,0.14);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--ink-2);
      font-family: var(--font); font-size: 15px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    html[lang="ko"] body { font-family: var(--kr); }
    button, input { font: inherit; color: inherit; }
    a { color: inherit; }

    /* ---------- header ---------- */
    .header {
      position: sticky; top: 0; z-index: 30; height: var(--header-h);
      display: flex; align-items: center;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
    .logo {
      width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(140deg, var(--accent), #ef7a3d);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      position: relative; flex: none;
    }
    .logo::after {
      content: ""; position: absolute; inset: 7px 7px auto auto;
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.9);
    }
    .brand small { display: block; font-weight: 450; color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .tag-latest {
      font-family: var(--mono); font-size: 12px; color: var(--muted);
      padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 999px;
    }
    .tag-latest b { color: var(--ink); font-weight: 600; }

    /* language toggle */
    .langs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg-soft); }
    .langs button {
      padding: 4px 11px; border: none; border-radius: 999px; cursor: pointer;
      font-size: 12.5px; font-weight: 500; color: var(--muted); background: transparent;
      transition: color 0.15s, background 0.15s;
    }
    .langs button:hover { color: var(--ink-2); }
    .langs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.10); }

    /* ---------- shell ---------- */
    .shell {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: grid; grid-template-columns: 232px 1fr; gap: 56px; align-items: start;
    }
    .sidebar { position: sticky; top: calc(var(--header-h) + 24px); padding: 32px 0; }
    .sidebar h3 { margin: 0 0 12px; padding: 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .nav { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - var(--header-h) - 110px); overflow: auto; }
    .nav li a {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--muted);
      font-size: 13px; border-left: 2px solid transparent; transition: background 0.15s, color 0.15s;
    }
    .nav li a .nv { font-family: var(--mono); font-weight: 500; color: var(--ink-2); font-size: 13px; }
    .nav li a .nd { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
    .nav li a:hover { background: var(--bg-soft); }
    .nav li.active a { background: var(--accent-weak); border-left-color: var(--accent); }
    .nav li.active a .nv { color: var(--accent); }

    /* ---------- main ---------- */
    main { padding: 32px 0 120px; min-width: 0; }
    .intro { padding: 8px 0 6px; }
    .intro h1 { margin: 0 0 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); }
    .intro p { margin: 0; color: var(--muted); font-size: 15px; }

    .filters {
      position: sticky; top: var(--header-h); z-index: 20;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin: 22px 0 8px; padding: 12px 0;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .tabs { display: flex; gap: 7px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      font-size: 13px; font-weight: 500; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 999px; cursor: pointer;
      color: var(--ink-2); background: transparent; border: 1px solid var(--line-2);
      transition: all 0.15s;
    }
    .tab:hover { border-color: var(--ink-2); }
    .tab .count { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--bg-soft); padding: 1px 6px; border-radius: 999px; }
    .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab[aria-selected="true"] .count { background: rgba(255,255,255,0.22); color: #fff; }
    .search { margin-left: auto; position: relative; flex: 0 1 230px; min-width: 150px; }
    .search input {
      width: 100%; font-size: 13.5px; color: var(--ink);
      padding: 8px 12px 8px 32px; border-radius: 9px;
      background: var(--bg-soft); border: 1px solid var(--line-2);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

    .release { padding: 34px 0; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--header-h) + 64px); }
    .release.first { border-top: none; }
    .release-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .release-ver { font-family: var(--mono); font-size: 21px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
    .release-ver a { text-decoration: none; }
    .release-date { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
    .latest {
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--accent); padding: 3px 9px; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .release-summary { margin: 12px 0 18px; color: var(--ink-2); font-size: 15.5px; max-width: 64ch; }
    .changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
    .change { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
    .change p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 62ch; }
    .badge {
      justify-self: start; margin-top: 1px;
      font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    }
    .badge.feature { color: var(--c-feature-fg); background: var(--c-feature-bg); }
    .badge.improvement { color: var(--c-improvement-fg); background: var(--c-improvement-bg); }
    .badge.fix { color: var(--c-fix-fg); background: var(--c-fix-bg); }
    .badge.chore { color: var(--c-chore-fg); background: var(--c-chore-bg); }
    .change[hidden], .release[hidden] { display: none; }
    .state { padding: 80px 0; text-align: center; color: var(--muted); }

    @media (max-width: 880px) { .shell { grid-template-columns: 1fr; gap: 0; } .sidebar { display: none; } }
    @media (max-width: 560px) { .change { grid-template-columns: 1fr; gap: 6px; } .tag-latest { display: none; } }
    @media (prefers-reduced-motion: no-preference) {
      .release { animation: fade 0.5s ease both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <span class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>스무디 키오스크<small>Smoothie Kiosk</small></span>
      </span>
      <span class="header-right">
        <span class="langs" id="langs" role="group" aria-label="Language"></span>
        <span class="tag-latest" id="latest-tag" hidden></span>
      </span>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <h3 id="nav-heading">Versions</h3>
      <ul class="nav" id="nav"></ul>
    </aside>

    <main>
      <div class="intro">
        <h1 id="title">Changelog</h1>
        <p id="intro-text"></p>
      </div>

      <div class="filters">
        <div class="tabs" id="tabs" role="tablist" aria-label="Filter by type"></div>
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" autocomplete="off" aria-label="Search updates" />
        </div>
      </div>

      <div id="releases"><p class="state" id="state">…</p></div>
    </main>
  </div>

  <script>
    /* ---- config: add a language here + provide its key in changelog.json ---- */
    const LANGS = [
      { code: "ko", label: "한국어" },
      { code: "en", label: "EN" },
    ];
    const DEFAULT_LANG = "en";
    const I18N = {
      en: {
        changelog: "Changelog",
        intro: "New features and improvements in the Smoothie Kiosk app.",
        search: "Search updates…",
        versions: "Versions",
        latest: "Latest",
        tabs: { all: "All", feature: "Features", improvement: "Improvements", fix: "Fixes" },
        badge: { feature: "New", improvement: "Improved", fix: "Fixed", chore: "Maintenance" },
        loading: "Loading…",
        empty: "No matching updates.",
        none: "No updates yet.",
        error: "Couldn't load the update history. Please try again later.",
      },
      ko: {
        changelog: "업데이트 노트",
        intro: "스무디 키오스크 앱의 새로운 기능과 개선 사항입니다.",
        search: "업데이트 검색…",
        versions: "버전",
        latest: "최신",
        tabs: { all: "전체", feature: "새 기능", improvement: "개선", fix: "수정" },
        badge: { feature: "신규", improvement: "개선", fix: "수정", chore: "기타" },
        loading: "불러오는 중…",
        empty: "일치하는 업데이트가 없습니다.",
        none: "아직 등록된 업데이트 내역이 없습니다.",
        error: "업데이트 내역을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",
      },
    };
    const TAB_ORDER = ["all", "feature", "improvement", "fix"];

    let RELEASES = [];
    let lang = DEFAULT_LANG;
    let activeTab = "all";
    let query = "";

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const fmtDate = (iso) =>
      typeof iso === "string" && iso.length >= 10 ? iso.slice(0, 10).replace(/-/g, ".") : "";
    const t = () => I18N[lang] || I18N[DEFAULT_LANG];

    // Resolve an i18n field: a plain string applies to every language; an object
    // {en,ko,...} picks the active language, then DEFAULT_LANG, then anything set.
    function pick(field) {
      if (field == null) return "";
      if (typeof field === "string") return field;
      return field[lang] || field[DEFAULT_LANG] || Object.values(field).find(Boolean) || "";
    }

    function inferType(text) {
      const x = text.toLowerCase();
      if (/(^|\b)(fix|fixed|resolve|resolved|bug|오류|버그|수정|문제)/.test(x)) return "fix";
      if (/(add|added|new|introduc|support|추가|지원|신규|새 )/.test(x)) return "feature";
      if (/(internal|diagnostic|no visible|no user-facing|내부|진단)/.test(x)) return "chore";
      return "improvement";
    }

    // Resolve a raw release into the active language: { versionName, releasedAt, summary, changes }.
    function buildRelease(r) {
      let summary = "", changes = [];
      if (Array.isArray(r.changes) && r.changes.length) {
        summary = pick(r.summary);
        changes = r.changes.map((c) => {
          const text = pick(c.text);
          return { type: c.type || inferType(text), text };
        });
      } else {
        const text = String(pick(r.notes)).replace(/\r\n/g, "\n").trim();
        const intro = [];
        for (const line of text.split("\n")) {
          const m = line.match(/^\s*[-*•]\s+(.*)$/);
          if (m) changes.push({ type: inferType(m[1]), text: m[1].trim() });
          else if (line.trim()) intro.push(line.trim());
        }
        summary = pick(r.summary) || intro.join(" ");
        if (!changes.length && summary) {
          // Notes with no bullet lines: show the text once, as the lone
          // badged change (keeps it under the filter tabs) — not ALSO as
          // the summary paragraph, which would render it twice.
          changes.push({ type: inferType(summary), text: summary });
          summary = "";
        }
      }
      return { versionName: r.versionName || "?", releasedAt: r.releasedAt || "", summary, changes };
    }

    function renderTabs(built) {
      const tr = t();
      const counts = { all: 0, feature: 0, improvement: 0, fix: 0 };
      built.forEach((r) => r.changes.forEach((c) => {
        counts.all++;
        if (counts[c.type] !== undefined) counts[c.type]++;
      }));
      document.getElementById("tabs").innerHTML = TAB_ORDER.map((key) =>
        '<button class="tab" role="tab" data-tab="' + key + '" aria-selected="' + (key === activeTab) + '">' +
          esc(tr.tabs[key]) + '<span class="count">' + counts[key] + "</span>" +
        "</button>"
      ).join("");
    }

    function renderNav() {
      document.getElementById("nav").innerHTML = RELEASES.map((r) =>
        '<li data-nav="v' + esc(r.versionName) + '"><a href="#v' + esc(r.versionName) + '">' +
          '<span class="nv">v' + esc(r.versionName) + '</span>' +
          '<span class="nd">' + esc(fmtDate(r.releasedAt)) + "</span>" +
        "</a></li>"
      ).join("");
    }

    function renderReleases(built) {
      const tr = t();
      document.getElementById("releases").innerHTML = built.map((r, i) => {
        const id = "v" + esc(r.versionName);
        const changes = r.changes.map((c) =>
          '<li class="change" data-type="' + esc(c.type) + '" data-text="' + esc(c.text.toLowerCase()) + '">' +
            '<span class="badge ' + esc(c.type) + '">' + esc(tr.badge[c.type] || c.type) + "</span>" +
            "<p>" + esc(c.text) + "</p>" +
          "</li>"
        ).join("");
        return (
          '<article class="release' + (i === 0 ? " first" : "") + '" id="' + id +
            '" data-ver="' + esc(r.versionName.toLowerCase()) + '" style="animation-delay:' + Math.min(i * 0.03, 0.3) + 's">' +
            '<div class="release-head">' +
              '<span class="release-ver"><a href="#' + id + '">v' + esc(r.versionName) + "</a></span>" +
              (i === 0 ? '<span class="latest">' + esc(tr.latest) + "</span>" : "") +
              '<span class="release-date">' + esc(fmtDate(r.releasedAt)) + "</span>" +
            "</div>" +
            (r.summary ? '<p class="release-summary">' + esc(r.summary) + "</p>" : "") +
            '<ul class="changes">' + changes + "</ul>" +
          "</article>"
        );
      }).join("");
      spy.observeAll();
    }

    function applyFilter() {
      let any = false;
      document.querySelectorAll(".release").forEach((rel) => {
        let visible = 0;
        const verMatch = !query || rel.dataset.ver.includes(query);
        rel.querySelectorAll(".change").forEach((ch) => {
          const okTab = activeTab === "all" || ch.dataset.type === activeTab;
          const okText = !query || verMatch || ch.dataset.text.includes(query);
          const show = okTab && okText;
          ch.hidden = !show;
          if (show) visible++;
        });
        rel.hidden = visible === 0;
        if (visible) any = true;
      });
      let empty = document.getElementById("empty-state");
      if (!any) {
        if (!empty) {
          empty = document.createElement("p");
          empty.id = "empty-state"; empty.className = "state";
          document.getElementById("releases").appendChild(empty);
        }
        empty.textContent = t().empty; empty.hidden = false;
      } else if (empty) empty.hidden = true;
    }

    const spy = (() => {
      let obs = null, active = null;
      const set = (id) => {
        if (id === active) return;
        active = id;
        document.querySelectorAll("#nav li").forEach((li) => li.classList.toggle("active", li.dataset.nav === id));
      };
      return {
        observeAll() {
          if (obs) obs.disconnect();
          obs = new IntersectionObserver((entries) => {
            const vis = entries.filter((e) => e.isIntersecting)
              .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
            if (vis[0]) set(vis[0].target.id);
          }, { rootMargin: "-30% 0px -60% 0px", threshold: 0 });
          document.querySelectorAll(".release").forEach((r) => obs.observe(r));
        },
      };
    })();

    function renderLangToggle() {
      document.getElementById("langs").innerHTML = LANGS.map((l) =>
        '<button type="button" data-lang="' + l.code + '" aria-pressed="' + (l.code === lang) + '">' + esc(l.label) + "</button>"
      ).join("");
    }

    function updateUI() {
      const tr = t();
      document.documentElement.lang = lang;
      document.getElementById("title").textContent = tr.changelog;
      document.getElementById("intro-text").textContent = tr.intro;
      document.getElementById("search").placeholder = tr.search;
      document.getElementById("nav-heading").textContent = tr.versions;
      const tag = document.getElementById("latest-tag");
      if (RELEASES.length) { tag.innerHTML = esc(tr.latest) + ' <b>v' + esc(RELEASES[0].versionName) + "</b>"; tag.hidden = false; }
      document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));

      const built = RELEASES.map(buildRelease);
      renderTabs(built);
      renderNav();
      renderReleases(built);
      applyFilter();
    }

    function setLang(code) {
      if (!LANGS.some((l) => l.code === code) || code === lang) return;
      lang = code;
      try { localStorage.setItem("cl-lang", code); } catch (e) {}
      updateUI();
    }

    function detectLang() {
      try {
        const stored = localStorage.getItem("cl-lang");
        if (stored && LANGS.some((l) => l.code === stored)) return stored;
      } catch (e) {}
      const nav = (navigator.language || "").slice(0, 2).toLowerCase();
      return LANGS.some((l) => l.code === nav) ? nav : DEFAULT_LANG;
    }

    function wire() {
      document.getElementById("langs").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-lang]");
        if (b) setLang(b.dataset.lang);
      });
      document.getElementById("tabs").addEventListener("click", (e) => {
        const btn = e.target.closest(".tab");
        if (!btn) return;
        activeTab = btn.dataset.tab;
        document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.tab === activeTab));
        applyFilter();
      });
      document.getElementById("search").addEventListener("input", (e) => {
        query = e.target.value.trim().toLowerCase();
        applyFilter();
      });
    }

    fetch("./changelog.json", { cache: "no-cache" })
      .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then((data) => {
        RELEASES = data.releases || [];
        lang = detectLang();
        if (!RELEASES.length) {
          document.documentElement.lang = lang;
          document.getElementById("releases").innerHTML = '<p class="state">' + esc(t().none) + "</p>";
          renderLangToggle(); return;
        }
        renderLangToggle();
        wire();
        updateUI();
      })
      .catch(() => {
        document.getElementById("state").textContent = t().error;
      });
  </script>
</body>
</html>
